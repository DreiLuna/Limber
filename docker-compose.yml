services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-limber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-limber}
      POSTGRES_DB: ${POSTGRES_DB:-limber}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-limber}"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-limber}:${POSTGRES_PASSWORD:-limber}@db:5432/${POSTGRES_DB:-limber}
    ports: ["8000:8000"]
    volumes: [./backend:/app]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://backend:8000
    ports: ["5173:5173"]
    volumes: [./frontend:/app, /app/node_modules]
    depends_on: [backend]

volumes:
  pgdata:
